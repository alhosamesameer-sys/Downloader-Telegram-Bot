[tool.ruff]
target-version="py311"
line-length=120
[tool.ruff.lint]
ignore=["E501","E701","E702","F401","I001","BLE001"]
[tool.black]
line-length=120
target-version=["py311"]
[tool.mypy]
python_version="3.12"
ignore_missing_imports=true
check_untyped_defs=false
disallow_untyped_defs=false
warn_unused_ignores=true
[tool.pytest.ini_options]
asyncio_mode="auto"
testpaths=["tests"]
